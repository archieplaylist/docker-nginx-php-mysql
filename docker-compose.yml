version: '3.8'

networks:
    frontend-network:
        driver: bridge
    backend-network:
        driver: bridge

services:
    mysqldb:
        image: mysql:${MYSQL_VERSION}
        container_name: ${MYSQL_HOST}
        restart: always
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_USER=${MYSQL_USER}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        ports:
            - "${MYSQL_PORT:-8989}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d
        networks:
            - backend-network
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 30s

    web:
        image: nginx:alpine
        volumes:
            - "./etc/nginx/workspace:/etc/nginx/conf.d/workspace"
            - "./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf"
            - "./etc/nginx/default.template.conf:/etc/nginx/conf.d/default.template"
            - "./etc/ssl:/etc/ssl"
            - "./web:/var/www/html"
        ports:
            - "${NGINX_PORT:-8000}:80"
            - "${NGINX_SSL_PORT:-3000}:443"
        environment:
            - NGINX_HOST=${NGINX_HOST}
            - APP_WORKSPACE=${APP_WORKSPACE:-default}
            - APP_DIR=${APP_DIR:-app}
            - APP_PUBLIC_DIR=${APP_DIR:-app}/public
            - NGINX_WORKSPACE_DIR=${NGINX_WORKSPACE_DIR:-workspace}
        command: /bin/sh -c "envsubst '$$NGINX_HOST $$APP_WORKSPACE $$APP_PUBLIC_DIR $$NGINX_WORKSPACE_DIR' < /etc/nginx/conf.d/default.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
        restart: always
        depends_on:
            - php
            - mysqldb
        networks:
            - frontend-network
            - backend-network
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost" ]
            interval: 10s
            timeout: 3s
            retries: 3

    php:
        build:
            context: ./docker/php
            args:
                PHP_VERSION: ${PHP_VERSION}
                PHP_TARGET: ${PHP_TARGET:-dev}
        restart: always
        volumes:
            - "./etc/php/${PHP_INI:-php.dev.ini}:/usr/local/etc/php/conf.d/99-custom.ini"
            - "./web:/var/www/html"
        networks:
            - backend-network
        healthcheck:
            test: [ "CMD", "php-fpm", "-t" ]
            interval: 10s
            timeout: 5s
            retries: 3

    myadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        ports:
            - "${PHPMYADMIN_PORT:-8080}:80"
        environment:
            - PMA_ARBITRARY=1
            - PMA_HOST=${MYSQL_HOST}
            - PMA_USER=${PHPMYADMIN_USER:-root}
            - PMA_PASSWORD=${PHPMYADMIN_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - UPLOAD_LIMIT=${PHPMYADMIN_UPLOAD_LIMIT:-100M}
        restart: always
        depends_on:
            mysqldb:
                condition: service_healthy
        networks:
            - frontend-network
            - backend-network
        profiles:
            - ${PHPMYADMIN_PROFILE:-dev}

    mailhog:
        image: mailhog/mailhog
        ports:
            - "${MAILHOG_SMTP_PORT:-1025}:1025"        # SMTP port for sending emails
            - "${MAILHOG_UI_PORT:-8025}:8025"          # Web interface for viewing emails
        environment:
            - MH_SMTP_BIND_ADDR=0.0.0.0:1025           # Binding address for the SMTP server
            - MH_API_BIND_ADDR=0.0.0.0:8025            # Binding address for the API
            - MH_UI_BIND_ADDR=0.0.0.0:8025             # Binding address for the user interface
            - MH_STORAGE=${MAILHOG_STORAGE:-memory}    # Storage method (memory, mongodb)
            - MH_HOSTNAME=${MAILHOG_HOSTNAME:-mailhog} # Hostname to use for EHLO/HELO links
            - MH_CORS_ORIGIN=${MAILHOG_CORS_ORIGIN:-*} # CORS Configuration
        networks:
            - backend-network
        profiles:
            - ${MAILHOG_PROFILE:-dev}

    apidocs:
        image: nginx:alpine
        volumes:
            - "./docs/api/html:/usr/share/nginx/html:ro"
        ports:
            - "${APIDOCS_PORT:-8081}:80"
        networks:
            - frontend-network
        profiles:
            - ${APIDOCS_PROFILE:-dev}

volumes:
    mysql_data:
        name: ${APP_NAME:-docker_nginx_php_mysql}_mysql_data
