version: '3.8'

networks:
    frontend-network:
        driver: bridge
    backend-network:
        driver: bridge

services:
    mysqldb:
        image: mysql:${MYSQL_VERSION}
        container_name: ${MYSQL_HOST}
        restart: always
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_USER=${MYSQL_USER}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        ports:
            - "8989:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d
        networks:
            - backend-network
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 30s

    web:
        image: nginx:alpine
        volumes:
            - "./etc/nginx/framework:/etc/nginx/conf.d/framework"
            - "./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf"
            - "./etc/nginx/default.template.conf:/etc/nginx/conf.d/default.template"
            - "./etc/ssl:/etc/ssl"
            - "./web:/var/www/html"
        ports:
            - "8000:80"
            - "3000:443"
        environment:
            - NGINX_HOST=${NGINX_HOST}
            - APP_FRAMEWORK=${APP_FRAMEWORK:-default}
            - APP_PUBLIC_DIR=${APP_PUBLIC_DIR:-public}
            - NGINX_FRAMEWORK_DIR=${NGINX_FRAMEWORK_DIR:-framework}
        command: /bin/sh -c "envsubst '$$NGINX_HOST $$APP_FRAMEWORK $$APP_PUBLIC_DIR $$NGINX_FRAMEWORK_DIR' < /etc/nginx/conf.d/default.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
        restart: always
        depends_on:
            - php
            - mysqldb
        networks:
            - frontend-network
            - backend-network
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost" ]
            interval: 10s
            timeout: 3s
            retries: 3

    php:
        build:
            context: ./docker/php
            args:
                PHP_VERSION: ${PHP_VERSION}
                PHP_TARGET: ${PHP_TARGET:-dev}
        restart: always
        volumes:
            - "./etc/php/php.ini:/usr/local/etc/php/conf.d/custom.ini"
            - "./web:/var/www/html"
        environment:
            - PHP_DISPLAY_ERRORS=${PHP_DISPLAY_ERRORS:-1}
            - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
            - XDEBUG_ENABLED=${XDEBUG_ENABLED:-1}
        networks:
            - backend-network
        healthcheck:
            test: [ "CMD", "php-fpm", "-t" ]
            interval: 10s
            timeout: 5s
            retries: 3

    myadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        ports:
            - "8080:80"
        environment:
            - PMA_ARBITRARY=1
            - PMA_HOST=${MYSQL_HOST}
            - PMA_USER=${PHPMYADMIN_USER:-root}
            - PMA_PASSWORD=${PHPMYADMIN_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - UPLOAD_LIMIT=${PHPMYADMIN_UPLOAD_LIMIT:-100M}
        restart: always
        depends_on:
            mysqldb:
                condition: service_healthy
        networks:
            - frontend-network
            - backend-network
        profiles:
            - ${PHPMYADMIN_PROFILE:-dev}

volumes:
  mysql_data:
    name: ${PROJECT_NAME:-docker_nginx_php_mysql}_mysql_data
