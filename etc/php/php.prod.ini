;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; PHP Production Environment Configuration  ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[PHP]
; Timezone setting
date.timezone = UTC

; Error reporting settings - Production focused
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/log/php/php_errors.log
ignore_repeated_errors = On
report_memleaks = Off
html_errors = Off

; Security settings
expose_php = Off
disable_functions = system,exec,shell_exec,passthru,proc_open,popen,show_source,phpinfo

; Memory and execution limits - Optimized for production
memory_limit = 128M
max_execution_time = 60
max_input_time = 60
post_max_size = 20M
upload_max_filesize = 20M

; Request handling
max_input_vars = 2000
realpath_cache_size = 4M
realpath_cache_ttl = 600

; Session settings - Secure for production
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 3600
session.use_only_cookies = 1
session.gc_probability = 1
session.gc_divisor = 100

; Performance optimizations
zlib.output_compression = On
zlib.output_compression_level = 4
implicit_flush = Off

; Opcache settings - Production optimized
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1
opcache.enable_file_override = 1
opcache.save_comments = 1
opcache.enable_cli = 0
opcache.huge_code_pages = 1
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; File handling
allow_url_fopen = Off
file_uploads = On
default_socket_timeout = 30

; Xdebug is disabled in production
[Xdebug]
xdebug.mode = off
