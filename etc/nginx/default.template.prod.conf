# ============================================================================
# Production Web Server Configuration (template)
# ============================================================================
# This template is rendered at container startup via envsubst.
# It replaces default.template.conf when running in production mode.
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${NGINX_HOST};
    server_tokens off;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;

    # Virtual directory resolution via map (safer than if)
    set $realdir "";

    if ($request_uri ~ ^/([^/]*)/.*$ ) {
        set $realdir /$1;
    }

    if (-d "$document_root$realdir") {
        # keep $realdir as is
    }

    # gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ $realdir/index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Hardened FastCGI params
        fastcgi_param PHP_VALUE "display_errors=off";
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to vendor and other sensitive dirs
    location ~ ^/app/ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
